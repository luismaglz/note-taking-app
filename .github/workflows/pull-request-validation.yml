name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NoteTakingApp.sln

      - name: Build
        run: dotnet build NoteTakingApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test NoteTakingApp.sln --no-build --configuration Release
